<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン｜新人研修用マニュアル</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Oswald:wght@400;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      background: #07090f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* グリッド背景 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,180,216,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,216,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* 光のエフェクト */
    .glow-top {
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(0,180,216,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .glow-bottom {
      position: fixed;
      bottom: -200px; right: -100px;
      width: 500px; height: 400px;
      background: radial-gradient(ellipse, rgba(0,100,160,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 10;
    }

    /* ロゴ部分 */
    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-text {
      font-family: 'Oswald', sans-serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #fff;
    }
    .logo-sub {
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(0,180,216,0.8);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* カード本体 */
    .form-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(0,180,216,0.2);
      border-radius: 4px;
      padding: 40px 36px;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(0,180,216,0.05),
        0 20px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* 角の装飾 */
    .form-card::before, .form-card::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border-color: rgba(0,180,216,0.6);
      border-style: solid;
    }
    .form-card::before {
      top: -1px; left: -1px;
      border-width: 2px 0 0 2px;
    }
    .form-card::after {
      bottom: -1px; right: -1px;
      border-width: 0 2px 2px 0;
    }

    .form-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(0,180,216,0.9);
      text-transform: uppercase;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .form-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(0,180,216,0.2);
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(0,180,216,0.2);
      border-radius: 3px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.25s;
      font-family: inherit;
      letter-spacing: 1px;
    }
    input::placeholder { color: rgba(255,255,255,0.2); letter-spacing: 0; }
    input:focus {
      border-color: rgba(0,180,216,0.6);
      background: rgba(0,180,216,0.05);
      box-shadow: 0 0 0 3px rgba(0,180,216,0.08), 0 0 20px rgba(0,180,216,0.05);
    }

    button {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid rgba(0,180,216,0.5);
      border-radius: 3px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(0,180,216,0.9);
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }
    button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,180,216,0.08);
      transform: translateX(-100%);
      transition: transform 0.3s;
    }
    button:hover::before { transform: translateX(0); }
    button:hover {
      border-color: rgba(0,180,216,0.9);
      color: #fff;
      box-shadow: 0 0 20px rgba(0,180,216,0.15);
    }

    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border: 1px solid rgba(255,80,80,0.3);
      border-radius: 3px;
      background: rgba(255,80,80,0.05);
      color: rgba(255,100,100,0.9);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.15);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>

  <div class="card">
    <div class="logo-area">
      <div class="logo-text">RUNBIRD</div>
      <div class="logo-sub">Internal Training Manual</div>
    </div>

    <div class="form-card">
      <div class="form-title">Secure Access</div>

      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="pw" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')login()">
      </div>

      <button onclick="login()">Login →</button>
      <div class="error" id="err">⚠ パスワードが正しくありません</div>
    </div>

    <div class="footer">© Runbird Inc. All rights reserved.</div>
  </div>

  <script>
    document.getElementById('pw').focus();
    async function login() {
      const pw = document.getElementById('pw').value;
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      const hash = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      if (hash === '8d79ccdc4a3becedae6fc1e5aca824292274b488cfd05905144a1829aa9ccc4f') {
        sessionStorage.setItem('rb_auth','1');
        location.href = '/staff-training/';
      } else {
        document.getElementById('err').style.display = 'block';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }
  </script>
</body>
</html>
