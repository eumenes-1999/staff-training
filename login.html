<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン｜新人研修用マニュアル</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    /* 背景の装飾 */
    body::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(192,0,0,0.15) 0%, transparent 70%);
      top: -100px; left: -100px;
      border-radius: 50%;
    }
    body::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(21,101,192,0.15) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      border-radius: 50%;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #c00, #e53935);
      border-radius: 16px;
      font-size: 28px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(192,0,0,0.4);
    }
    .brand h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .brand p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 0 0 28px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }
    .input-wrap::before {
      content: '🔑';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      font-size: 15px;
      color: #fff;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    input::placeholder { color: rgba(255,255,255,0.3); }
    input:focus {
      border-color: rgba(192,0,0,0.6);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 3px rgba(192,0,0,0.15);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #c00, #e53935);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(192,0,0,0.4);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(192,0,0,0.5);
    }
    button:active { transform: translateY(0); }
    .error {
      display: none;
      background: rgba(192,0,0,0.15);
      border: 1px solid rgba(192,0,0,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-badge">📚</div>
      <h1>新人研修用マニュアル</h1>
      <p>株式会社ランバード｜社内資料</p>
    </div>
    <div class="divider"></div>
    <label>PASSWORD</label>
    <div class="input-wrap">
      <input type="password" id="pw" placeholder="パスワードを入力してください" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button onclick="login()">ログイン →</button>
    <div class="error" id="err">⚠ パスワードが正しくありません</div>
    <div class="footer">© 株式会社ランバード</div>
  </div>
  <script>
    document.getElementById('pw').focus();
    async function login() {
      const pw = document.getElementById('pw').value;
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      const hash = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      if (hash === '8d79ccdc4a3becedae6fc1e5aca824292274b488cfd05905144a1829aa9ccc4f') {
        sessionStorage.setItem('rb_auth','1');
        location.href = '/staff-training/';
      } else {
        document.getElementById('err').style.display = 'block';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }
  </script>
</body>
</html>
